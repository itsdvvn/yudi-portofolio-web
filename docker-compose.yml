services:
  portfolio:
    build: .
    container_name: yudi-portfolio-web
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - R2_ACCOUNT_ID=54654e7eebbed345259d292ae43dafe6
      - R2_BUCKET_NAME=yudi-web-personal
      - R2_PUBLIC_DOMAIN=https://media.itsdvvn.my.id
    volumes:
      - ./src/content:/app/src/content
    networks:
      - server_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`itsdvvn.my.id`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
      - "traefik.http.services.portfolio.loadbalancer.server.port=4321"

networks:
  server_web:
    external: true
